# Render Blueprint: both services defined as code.
#
# autoDeploy is false on purpose. Render's default is to deploy on every push to
# the default branch, which would bypass CI entirely and ship a red build. Deploys
# are triggered by .github/workflows/deploy.yml only after tests pass.
#
# Secrets (sync: false) are set once in the Render dashboard and never committed.

services:
  - type: web
    name: medical-agent-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Must match the credentials file. Not always "neo4j".
      - key: NEO4J_DATABASE
        sync: false
      - key: GROQ_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      # Graph extraction prompts exceed Groq's free per-minute token ceiling.
      - key: GRAPH_LLM_PROVIDER
        value: gemini
      # CrewAI strips its cache-breakpoint markers only for native providers.
      - key: AGENT_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      # Must match the dimension the Neo4j vector index was seeded with.
      - key: EMBEDDING_DIM
        value: "768"
      # Exact origin of the static site below. Update if the site is renamed.
      - key: ALLOWED_ORIGINS
        value: https://medical-agent-ui.onrender.com
      - key: DAILY_QUERY_LIMIT
        value: "5"
      - key: GRAPH_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: medical-agent-ui
    runtime: static
    # No plan key: static sites have no instance type and are always free.
    # Setting one fails validation with "no such plan free for service type web".
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        value: https://medical-agent-api.onrender.com
    routes:
      # Single-page app: every unknown path resolves to the entry document.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
