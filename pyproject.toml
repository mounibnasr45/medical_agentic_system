[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend", ".venv", "venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
]
ignore = [
    "B008",  # FastAPI dependency defaults are call expressions by design
    "E501",  # long lines are caught by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Test helpers reach into module internals deliberately.
"tests/*" = ["SLF001"]
